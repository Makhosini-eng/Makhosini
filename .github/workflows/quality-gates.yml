name: CAPITAL KING Quality Gates

on:
  pull_request:
  push:
    branches:
      - master
      - "capital-king/**"

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, syntax and browser policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Node.js runtime
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Install pinned development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run unit and policy tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run browser approval-gate tests
        run: npm run test:browser

# This workflow intentionally has no deployment, publishing, messaging,
# secret access, or write-capable token permissions.
