name: CAPITAL KING Quality Gates

on:
  pull_request:
  push:
    branches:
      - master
      - "capital-king/**"

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Node.js runtime
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check

# This workflow intentionally has no deployment, publishing, messaging,
# secret access, or write-capable token permissions.
